services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_DSN: "host=postgres port=5432 dbname=postgres user=postgres password=postgres"
      SQLITE_PATH: "/data/history.db"
      REPLICATION_SLOT: "artifacts_history_slot"
      SOURCE_TABLE: "artifacts"
      WEB_PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - historydata:/data
    restart: unless-stopped

volumes:
  pgdata:
  historydata:
